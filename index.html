<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutoTips</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f5f5f5}
  header{text-align:center;padding:25px 15px;background:white}
  header h1{color:#e53935;font-size:38px}
  header p{color:#333}
  .search-box{padding:15px;background:white;text-align:center}
  .search-box input{width:90%;max-width:500px;padding:14px 20px;border-radius:30px;border:2.5px solid #e53935;outline:none;font-size:16px}
  .filters{display:flex;gap:10px;overflow-x:auto;padding:15px;background:white;justify-content:center}
  .filters button{padding:10px 20px;border-radius:25px;border:2.5px solid #e53935;background:white;font-weight:bold;cursor:pointer;white-space:nowrap}
  .filters button.active{background:#e53935;color:white}
  .grid{display:grid;grid-template-columns:1fr;gap:20px;padding:20px;max-width:800px;margin:0 auto}
  .card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  .card img{width:100%;height:200px;object-fit:cover;display:block}
  .card-content{padding:15px}
  .card-content h3{margin-bottom:8px}
  .card-content p{color:#666;margin-bottom:12px;font-size:14px}
  .btn{display:block;text-align:center;background:#e53935;color:white;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<header>
  <h1>💡 TutoTips</h1>
  <p>Tutoriales que sí sirven</p>
</header>

<div class="search-box">
  <input type="text" id="buscador" placeholder="Buscar tutorial..." onkeyup="filtrar()">
</div>

<div class="filters">
  <button class="active" onclick="filtrarCat('todos', this)">Todos</button>
  <button onclick="filtrarCat('tecnologia', this)">💻 Tecnología</button>
  <button onclick="filtrarCat('comida', this)">🍔 Comida</button>
</div>

<div class="grid" id="grid">

  <!-- TARJETA ARREGLADA - ESTA ES LA QUE NO CARGABA -->
  <div class="card" data-cat="tecnologia">
    <img src="https://img.youtube.com/vi/K2VdIB0a2MY/hqdefault.jpg" alt="Como hacer tu propia página web">
    <div class="card-content">
      <h3>Como hacer tu propia página web</h3>
      <p>Sin pagar nada. GitHub Pages gratis.</p>
      <a class="btn" href="https://www.youtube.com/watch?v=K2VdIB0a2MY" target="_blank">Ver tutorial</a>
    </div>
  </div>

  <!-- Puedes duplicar esta tarjeta para agregar más -->
  <div class="card" data-cat="comida">
    <img src="https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600" alt="hamburguesa">
    <div class="card-content">
      <h3>Hamburguesa casera jugosa</h3>
      <p>En 10 minutos.</p>
      <a class="btn" href="https://www.youtube.com/results?search_query=hamburguesa+casera" target="_blank">Ver tutorial</a>
    </div>
  </div>

</div>

<script>
  let catActual = 'todos';
  function filtrar(){
    let texto = document.getElementById('buscador').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card=>{
      let titulo = card.innerText.toLowerCase();
      let coincideTexto = titulo.includes(texto);
      let coincideCat = catActual === 'todos' || card.dataset.cat === catActual;
      card.style.display = (coincideTexto && coincideCat) ? 'block' : 'none';
    });
  }
  function filtrarCat(cat, btn){
    catActual = cat;
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filtrar();
  }
</script>

</body>
</html>
