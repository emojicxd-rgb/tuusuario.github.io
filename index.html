<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutoTips 70</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f141e;color:#fff;padding:12px}
h1{font-size:32px;margin:10px 0}h1 span{color:#ff6b35}
.cats{display:flex;gap:8px;overflow:auto;padding:10px 0}
.cats button{background:#1f2937;border:none;color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;white-space:nowrap}
.cats button.active{background:#ff6b35;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.card{background:#1c2535;border-radius:16px;overflow:hidden;border:1px solid #2a364e}
.thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:50px}
.info{padding:10px}
.tag{background:#ffeb3b;color:#000;font-size:9px;font-weight:900;padding:3px 8px;border-radius:20px}
.info h3{font-size:13px;margin:6px 0 2px;height:32px;overflow:hidden}
.btns{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;text-align:center;padding:8px;border-radius:8px;text-decoration:none;font-weight:800;font-size:12px}
.o{background:#ff6b35;color:#000}.out{border:1px solid #3a4a68;color:#fff}
</style>
</head>
<body>
<h1>Tuto<span>Tips</span></h1>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<script>
const cats=[{id:'hogar',name:'Hogar',emoji:'🏠',color:'#f97316'},{id:'gaming',name:'Gaming',emoji:'🎮',color:'#a855f7'},{id:'mascotas',name:'Mascotas',emoji:'🐶',color:'#f59e0b'},{id:'plantas',name:'Plantas',emoji:'🌵',color:'#22c55e'},{id:'ropa',name:'Ropa',emoji:'👕',color:'#ec4899'},{id:'cocina',name:'Cocina',emoji:'🍳',color:'#eab308'},{id:'escuela',name:'Escuela',emoji:'📚',color:'#06b6d4'}];
const base={hogar:["Doblar ropa en 2 seg","Limpiar baño sin cloro","Quitar sarro regadera","Organizar closet","Limpiar microondas","Quitar olor refri","Vidrios sin marcas","Doblar sabanas","Desinfectar esponjas","Organizar cables"],gaming:["Punteria Free Fire","Sensibilidad sin lag","Diamantes gratis","Subir a heroico","HUD 4 dedos","Quitar lag gama baja","Armas meta","Jugar en PC","Recuperar cuenta","Crear sala PVP"],mascotas:["Adiestrar cachorro","Gato no arañe","Quitar pulgas","No muerda todo","Baño sin miedo","Arenero sin olor","Cortar uñas","Perro solo casa","Comida casera","Use rascador"],plantas:["Revivir suculentas","Cuidados cactus","No pudrir al regar","Reproducir por hoja","Tierra ideal","Quitar cochinilla","Sol directo o no","Macetas drenaje","Abono natural","Decorar con suculentas"],ropa:["Manchas ropa blanca","Doblar jeans viaje","Quitar chicle","Ropa no encoja","Olor humedad","Planchar sin plancha","Organizar cajones","Pelos mascota","Tenis blancos","Doblar playeras"],cocina:["Arroz no se pegue","Pelar papas rapido","Huevo sin romperse","Cebolla sin llorar","Descongelar carne","Salsa no pique","Tortillas no se rompan","Frijoles sin gases","Limpiar estufa","Cilantro fresco"],escuela:["Exponer sin nervios","Tarea rapido 30min","Memorizar examen","Letra bonita","Organizar mochila","Apuntes bonitos","Concentrarse clase","Resumen rapido","No olvidar tarea","Pasar examen"]};
let all=[];cats.forEach(c=>{base[c.id].forEach(t=>{all.push({cat:c.id,emoji:c.emoji,color:c.color,title:t,query:t.toLowerCase().replace(/ /g,'+')})})});
const catsDiv=document.getElementById('cats');catsDiv.innerHTML='<button class="active" onclick="filtrar(\'todo\',this)">Todo (70)</button>'+cats.map(c=>`<button onclick="filtrar('${c.id}',this)">${c.name} (10)</button>`).join('');
const grid=document.getElementById('grid');
function pintar(l){grid.innerHTML=l.map(x=>`<div class="card"><div class="thumb" style="background:linear-gradient(135deg,${x.color},#1c2535)">${x.emoji}</div><div class="info"><span class="tag">${x.cat.toUpperCase()}</span><h3>${x.title}</h3><div class="btns"><a class="btn o" href="https://www.youtube.com/results?search_query=${x.query}" target="_blank">Buscar</a><a class="btn out" href="https://wa.me/?text=${encodeURIComponent(x.title)}" target="_blank">WA</a></div></div></div>`).join('');}
pintar(all);
function filtrar(cat,btn){document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(cat==='todo')pintar(all);else pintar(all.filter(a=>a.cat===cat));}
</script>
</body>
</html>
