<title>TutoTips</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#212A3A;color:#fff;min-height:100vh}
header{text-align:center;padding:25px 15px;background:#1A222F;border-bottom:3px solid #00F0FF}
.search-box{padding:15px;background:#1A222F;text-align:center;position:sticky;top:0;z-index:10}
.search-box input{width:90%;max-width:500px;padding:14px 20px;border-radius:30px;border:2.5px solid #00F0FF;background:#212A3A;color:#fff;outline:none}
.filters{display:flex;gap:10px;overflow-x:auto;padding:15px;background:#1A222F;position:sticky;top:70px;z-index:9}
.filters button{padding:12px 22px;border-radius:25px;border:2px solid #00F0FF;background:#212A3A;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0}
.filters button.active{background:#00F0FF;color:#000}
.grid{display:grid;grid-template-columns:1fr;gap:20px;padding:20px;max-width:800px;margin:0 auto}
.card{background:#2A3447;border-radius:15px;overflow:hidden;border:1px solid #2D3748}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-content{padding:15px} .tag{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:bold;display:inline-block;margin-bottom:6px}
.tag-tec{background:#9D4EDD}.tag-comida{background:#00F0FF;color:#000}.tag-hogar{background:#39FF14;color:#000}
.btn{display:block;text-align:center;background:#00F0FF;color:#000;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:10px}
footer{text-align:center;padding:30px;background:#1A222F;border-top:2px solid #00F0FF;margin-top:20px}
</style>
</head>
