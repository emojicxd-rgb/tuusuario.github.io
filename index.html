<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutoTips</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#fff;padding:15px 0;text-align:center}
.logo{font-size:28px;font-weight:bold;color:#e53935}
.buscador{width:90%;max-width:500px;padding:13px 18px;border:2px solid #e53935;border-radius:25px;margin:12px auto;display:block;outline:none;font-size:15px}
.categorias{display:flex;gap:10px;overflow-x:auto;padding:10px 15px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.categorias::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:10px 18px;border:2px solid #e53935;background:white;border-radius:20px;font-weight:bold;font-size:15px;cursor:pointer}
.cat.activa{background:#e53935;color:white}
.grid{padding:12px;display:grid;gap:16px}
.card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-content{padding:15px;text-align:left}
.btn{background:#e53935;color:white;border:0;padding:13px;border-radius:15px;width:100%;font-weight:bold;font-size:16px;display:block;text-align:center;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo">💡 TutoTips</div>
<div style="font-size:13px">Tutoriales que sí sirven</div>
<input class="buscador" id="buscador" placeholder="Buscar tutorial...">
<div class="categorias">
<button class="cat activa" data-filtro="todos">Todos</button>
<button class="cat" data-filtro="tecnologia">💻 Tecnología</button>
<button class="cat" data-filtro="comida">🍔 Comida</button>
<button class="cat" data-filtro="juegos">🎮 Juegos</button>
<button class="cat" data-filtro="manualidades">✂️ Manualidades</button>
</div>
</div>
<div class="grid" id="grid">
<div class="card" data-cat="tecnologia"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"><div class="card-content"><h3>Como hacer tu propia página web</h3><p>Sin pagar nada.</p><a class="btn" href="https://www.youtube.com/watch?v=2lAf9R5h3wQ" target="_blank">Ver tutorial</a></div></div>
<div class="card" data-cat="comida"><img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600"><div class="card-content"><h3>Pizza en 10 min</h3><p>Rápida y rica.</p><a class="btn" href="https://www.youtube.com/results?search_query=como+hacer+pizza+en+10+minutos+facil" target="_blank">Ver tutorial</a></div></div>
<div class="card" data-cat="juegos"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600"><div class="card-content"><h3>Trucos Free Fire</h3><p>Sube a Heroico.</p><a class="btn" href="https://www.youtube.com/results?search_query=trucos+free+fire+2025+espanol" target="_blank">Ver tutorial</a></div></div>
<div class="card" data-cat="manualidades"><img src="https://images.unsplash.com/photo-1452860606245-08befc0ff44b?w=600"><div class="card-content"><h3>Manualidad fácil</h3><p>Con cosas de casa.</p><a class="btn" href="https://www.youtube.com/results?search_query=manualidades+faciles+para+hacer+en+casa" target="_blank">Ver tutorial</a></div></div>
</div>
<script>
const cats=document.querySelectorAll('.cat');
const cards=document.querySelectorAll('.card');
cats.forEach(b=>{
 b.addEventListener('click',()=>{
  cats.forEach(x=>x.classList.remove('activa')); 
  b.classList.add('activa');
  let f=b.dataset.filtro;
  cards.forEach(c=>{c.style.display=(f=='todos'||c.dataset.cat==f)?'block':'none';});
 });
});
document.getElementById('buscador').addEventListener('input',e=>{
 let v=e.target.value.toLowerCase();
 cards.forEach(c=>c.style.display=c.innerText.toLowerCase().includes(v)?'block':'none');
});
</script>
</body>
</html>
