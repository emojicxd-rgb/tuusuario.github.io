*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#212A3A;color:#FFFFFF;display:flex;flex-direction:column;min-height:100vh}
header{text-align:center;padding:25px 15px;background:#1A222F;border-bottom:3px solid #00F0FF}
header h1{color:#FFFFFF;font-size:38px}
header p{color:#E9ECEF}
.search-box{padding:15px;background:#1A222F;text-align:center;position:sticky;top:0;z-index:10}
.search-box input{width:90%;max-width:500px;padding:14px 20px;border-radius:30px;border:2.5px solid #00F0FF;outline:none;background:#212A3A;color:#FFFFFF}
.filters{display:flex;gap:10px;overflow-x:auto;padding:15px;background:#1A222F;position:sticky;top:70px;z-index:9;white-space:nowrap}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:12px 22px;border-radius:25px;border:2px solid #00F0FF;background:#212A3A;color:#FFFFFF;font-weight:bold;cursor:pointer;flex-shrink:0}
.filters button.active{background:#00F0FF;color:#000}
.grid{display:grid;grid-template-columns:1fr;gap:20px;padding:20px;max-width:800px;margin:0 auto;width:100%;flex:1}
.card{background:#2A3447;border-radius:15px;overflow:hidden;border:1px solid #2D3748}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-content{padding:15px}
.card-content h3{color:#FFFFFF}
.card-content p{color:#E9ECEF;font-size:14px;margin-top:4px}
