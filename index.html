<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TutoTips</title>
<style>
body{font-family:Arial;margin:0;background:#eee}
.header{background:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:9}
.cat{padding:8px 15px;border:2px solid red;border-radius:20px;background:white;margin:3px;font-weight:bold}
.cat.activa{background:red;color:white}
.grid{padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.card{background:white;border-radius:15px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card div{padding:12px}
.btn{background:red;color:white;border:0;padding:10px 20px;border-radius:15px;width:100%;font-weight:bold}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:99;padding:20px;box-sizing:border-box}
#modalBox{background:white;padding:20px;border-radius:15px;max-width:600px;margin:auto}
</style>
</head>
<body>
<div class="header">
<h1>💡 TutoTips</h1>
<div>
<button class="cat activa" onclick="filtra('todos',this)">Todos</button>
<button class="cat" onclick="filtra('comida',this)">Comida</button>
<button class="cat" onclick="filtra('juegos',this)">Juegos</button>
<button class="cat" onclick="filtra('tecnologia',this)">Tecnologia</button>
</div>
</div>

<div class="grid">
<div class="card" data-cat="tecnologia"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"><div><h3>Pagina Web</h3><button class="btn" onclick="abrir('web')">VER TUTORIAL</button></div></div>
<div class="card" data-cat="comida"><img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600"><div><h3>Pizza Rapida</h3><button class="btn" onclick="abrir('comida')">VER TUTORIAL</button></div></div>
<div class="card" data-cat="juegos"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600"><div><h3>Trucos Free</h3><button class="btn" onclick="abrir('juegos')">VER TUTORIAL</button></div></div>
</div>

<div id="modal" onclick="if(event.target.id=='modal')cerrar()"><div id="modalBox"></div></div>

<script>
function filtra(cat,btn){
document.querySelectorAll('.cat').forEach(b=>b.classList.remove('activa'));btn.classList.add('activa');
document.querySelectorAll('.card').forEach(c=>{c.style.display=(cat=='todos'||c.dataset.cat==cat)?'block':'none'})
}
function abrir(t){
let html='';
if(t=='web') html='<h2>Como hacer pagina web</h2><p><b>En PC:</b> GitHub > Nuevo repo > pon emojicxd-rgb.github.io > sube tu index.html</p><p><b>En Celular:</b> Descarga app GitHub y haz lo mismo, pero usa Chrome en modo computadora.</p>';
if(t=='comida') html='<h2>Pizza en 10 min</h2><p>Pan pita, salsa, queso, al sarten 5 min.</p>';
if(t=='juegos') html='<h2>Trucos Free Fire</h2><p>Sube sensibilidad a 95 y juega a 4 dedos.</p>';
document.getElementById('modalBox').innerHTML=html+'<br><button class="btn" onclick="cerrar()">Cerrar</button>';
document.getElementById('modal').style.display='block';
}
function cerrar(){document.getElementById('modal').style.display='none';}
</script>
</body>
</html>
