<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutoTips</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#212A3A;color:#fff}
header{text-align:center;padding:25px;background:#1A222F;border-bottom:3px solid #00F0FF}
header h1{font-size:36px}
header p{color:#E9ECEF;font-weight:bold;margin-top:6px;font-size:16px}
header p span{color:#00F0FF}
input[type=radio]{display:none}
.filters{display:flex;gap:10px;overflow-x:auto;padding:15px;background:#1A222F;position:sticky;top:0;z-index:10}
.filters label{padding:12px 22px;border-radius:25px;border:2px solid #00F0FF;background:#212A3A;color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap}
#todos:checked ~ .filters label[for=todos], #tecnologia:checked ~ .filters label[for=tecnologia], #comida:checked ~ .filters label[for=comida], #hogar:checked ~ .filters label[for=hogar]{background:#00F0FF;color:#000}
.grid{display:grid;grid-template-columns:1fr;gap:20px;padding:20px;max-width:800px;margin:0 auto}
.card{background:#2A3447;border-radius:15px;overflow:hidden;border:1px solid #2D3748}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-content{padding:15px}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:bold;display:inline-block;margin-bottom:6px}
.tag-tec{background:#9D4EDD}.tag-comida{background:#00F0FF;color:#000}.tag-hogar{background:#39FF14;color:#000}
.btn{display:block;text-align:center;background:#00F0FF;color:#000;padding:12px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:10px}
#tecnologia:checked ~ .grid .card:not([data-cat=tecnologia]){display:none}
#comida:checked ~ .grid .card:not([data-cat=comida]){display:none}
#hogar:checked ~ .grid .card:not([data-cat=hogar]){display:none}
footer{text-align:center;padding:30px;background:#1A222F;border-top:2px solid #00F0FF;margin-top:20px;font-weight:bold}
footer span{color:#00F0FF}
</style>
</head>
<body>
<header>
<h1>💡 TutoTips</h1>
<p>🚀desarrollado por <span>Joshua y meta pro</span> 🚀</p>
</header>

<input type="radio" name="cat" id="todos" checked>
<input type="radio" name="cat" id="tecnologia">
<input type="radio" name="cat" id="comida">
<input type="radio" name="cat" id="hogar">

<div class="filters">
<label for="todos">Todos (30)</label>
<label for="tecnologia">💻 Tecnología</
